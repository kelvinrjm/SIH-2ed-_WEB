<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 60" width="290" height="60" fill="none">
  <!-- Geometric Land Parcel / Map Boundary Badge -->
  <g id="parcel-boundary-icon" transform="translate(6, 6)">
    <!-- Base polygon boundary -->
    <polygon points="24,2 44,14 44,34 24,46 4,34 4,14" fill="#EBF4FF" stroke="#155A8A" stroke-width="2" stroke-linejoin="round" />
    <!-- Cadastral Sub-division boundary lines -->
    <line x1="4" y1="24" x2="44" y2="24" stroke="#2F6F9F" stroke-width="1.2" stroke-dasharray="2,2"/>
    <line x1="24" y1="2" x2="24" y2="46" stroke="#2F6F9F" stroke-width="1.2" stroke-dasharray="2,2"/>
    <polygon points="14,14 34,14 34,34 14,34" fill="rgba(21, 90, 138, 0.15)" stroke="#155A8A" stroke-width="1" />
    <!-- Geodetic Survey Benchmark Pin -->
    <circle cx="24" cy="24" r="4" fill="#155A8A" stroke="#0B2942" stroke-width="1.5" />
    <circle cx="24" cy="24" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- Typography: Dark Text for Light Backgrounds -->
  <g id="brand-text" transform="translate(60, 10)">
    <!-- "SLI" Primary Monogram -->
    <text x="0" y="27" font-family="'Inter', 'Roboto', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0B2942" letter-spacing="-0.02em">SLI</text>
    
    <!-- Vertical Divider -->
    <line x1="56" y1="4" x2="56" y2="34" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Platform Subtitle -->
    <text x="64" y="16" font-family="'Inter', 'Roboto', -apple-system, sans-serif" font-weight="800" font-size="11" fill="#0B2942" letter-spacing="0.04em">GEOSPATIAL LAND</text>
    <text x="64" y="30" font-family="'Inter', 'Roboto', -apple-system, sans-serif" font-weight="600" font-size="9" fill="#5E7180" letter-spacing="0.02em">Intelligence Platform</text>
  </g>
</svg>
